version: '3.8'

services:
  h3-java:
    build: .
    container_name: h3-java
    ports:
      - "18080:8080"
    env_file:
      - .env.prod
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./logs:/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: h3-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - h3-java
    restart: unless-stopped
