server:
  port: ${H3_SERVER_PORT:8080}

spring:
  application:
    name: h3-java

  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${H3_MYSQL_URL}
    username: ${H3_MYSQL_USERNAME}
    password: ${H3_MYSQL_PASSWORD}

  # MongoDB Atlas
  data:
    mongodb:
      uri: ${H3_MONGODB_URI}

  # RabbitMQ
  rabbitmq:
    host: ${H3_RABBITMQ_HOST}
    port: ${H3_RABBITMQ_PORT:5672}
    username: ${H3_RABBITMQ_USERNAME}
    password: ${H3_RABBITMQ_PASSWORD}
    virtual-host: ${H3_RABBITMQ_VHOST}

  # Spring Batch 메타 테이블 자동 생성 안 함
  batch:
    jdbc:
      initialize-schema: never

naver:
  gfa:
    redirect-uri: https://api.heeil.com/java/v1/h3/token/naver-gfa/callback

kakao:
  sa:
    client-id: ${KAKAO_SA_CLIENT_ID}
    client-secret: ${KAKAO_SA_CLIENT_SECRET}
    redirect-uri: https://api.heeil.com/java/v1/h3/token/kakao-sa/callback
  mo:
    client-id: ${KAKAO_MO_CLIENT_ID}
    client-secret: ${KAKAO_MO_CLIENT_SECRET}
    redirect-uri: https://api.heeil.com/java/v1/h3/token/kakao-mo/callback

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: https://api.heeil.com/java/v1/h3/token/google/callback
  developer-token: ${GOOGLE_DEVELOPER_TOKEN}
  manager-id: ${GOOGLE_MANAGER_ID}

# SendGrid
sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: web@heeil.com
  from-name: 희일커뮤니케이션

# OpenAI
openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4.1-mini
  temperature: 0.2

# JWT
jwt:
  secret: ${H3_JWT_SECRET}
  expiration-ms: ${H3_JWT_EXPIRATION:86400000}

# Meta API (추후 연동 시 사용 - 현재 빈값 허용)
meta:
  app-id: ${META_APP_ID:}
  app-secret: ${META_APP_SECRET:}
  access-token: ${META_ACCESS_TOKEN:}
  business-id: ${META_BUSINESS_ID:}
  ad-account-id: ${META_AD_ACCOUNT_ID:}

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.h3.h3_java
  configuration:
    map-underscore-to-camel-case: true
